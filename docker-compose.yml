services:
  postgres:
    image: postgres:16-alpine
    container_name: openpoll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpoll
      POSTGRES_PASSWORD: openpoll_dev_password
      POSTGRES_DB: openpoll
    ports:
      - "5433:5432"
    volumes:
      - openpoll_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpoll -d openpoll"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openpoll-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - openpoll_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openpoll_postgres_data:
  openpoll_redis_data:
